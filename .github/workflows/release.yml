name: Publish to PyPI and Docker Hub

# Il rilascio parte da un tag, non da una modifica a un file.
#
# Prima il trigger era `push` su main con `paths: ['setup.py']`: qualunque
# commit che toccasse setup.py pubblicava. Il 18/09/2026 e' andata esattamente
# cosi': il merge di una PR di dependabot che aggiornava le dipendenze ha
# pubblicato su Docker Hub `0.0.51` e `latest` da un commit che aveva ancora
# nltk 3.9, vulnerabile. Nessuno aveva chiesto un rilascio, e annullare il run
# non e' servito: la build multi-arch dura circa mezz'ora e il push era gia'
# avvenuto, mentre lo stato del run diceva "cancelled".
#
# Con i tag, pubblicare e' un gesto esplicito: `git tag v0.0.52 && git push --tags`.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Extract version from setup.py
        id: extract_version
        run: |
          VERSION=$(grep -oP "version=['\"]\K[^'\"]+" setup.py)
          echo "VERSION=$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
        shell: bash

      # Il tag e setup.py devono dire la stessa cosa. Senza questo controllo si
      # pubblica un pacchetto la cui versione non corrisponde al tag da cui
      # dice di venire, e su PyPI quel numero non si puo' riusare.
      - name: Il tag corrisponde alla versione in setup.py
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Il tag dice $TAG, setup.py dice $VERSION: allineali prima di rilasciare." >&2
            exit 1
          fi
          echo "tag $TAG == setup.py $VERSION"
        shell: bash

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel twine importlib_metadata==4.8.1

      - name: Build package
        run: python setup.py sdist bdist_wheel

      - name: Publish to Test PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_TOKEN }}
        run: |
          twine check dist/*
          twine upload --repository-url https://test.pypi.org/legacy/ dist/* --verbose

      - name: Verify installation from Test PyPI
        run: |
          pip install --index-url https://test.pypi.org/simple/ uglypy --extra-index-url https://pypi.org/simple

      - name: Publish package to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          twine upload dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        continue-on-error: true
        with:
          tag_name: v${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          # Erano tre righe scritte a mano, identiche a ogni rilascio: dicevano
          # "Security fixes (path traversal, YAML deserialization)" anche a chi
          # installava una versione che non le conteneva. Meglio le note
          # generate da GitHub, che almeno descrivono i commit veri.
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  docker_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Extract version from setup.py
        id: extract_version
        run: |
          VERSION=$(grep -oP "version=['\"]\K[^'\"]+" setup.py)
          echo "VERSION=$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
        shell: bash

      # ── Multi-arch build infrastructure ────────────────────────

      - name: Set up QEMU (cross-platform emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Registry logins ────────────────────────────────────────

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Image metadata ─────────────────────────────────────────

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            fabriziosalmi/uglyfeed
            ghcr.io/${{ github.repository_owner }}/uglyfeed
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.VERSION }}
            type=sha,prefix=

      # ── Multi-arch build & push ─────────────────────────────────

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
